services:
  # ---------------------------------------------------------------
  # Base de datos PostgreSQL 17 + PostGIS
  # ---------------------------------------------------------------
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: observatorio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hidalgo}
      POSTGRES_USER: ${POSTGRES_USER:-hidalgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hidalgo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/backups:/backups:ro
      - ./docker/db/20_restore_backups.sh:/docker-entrypoint-initdb.d/20_restore_backups.sh:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------
  # GeoServer (WFS/WMS) conectado a PostGIS
  # ---------------------------------------------------------------
  geoserver:
    image: docker.osgeo.org/geoserver:2.26.2
    container_name: observatorio-geoserver
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,HEAD,OPTIONS"
      INITIAL_MEMORY: 1G
      MAXIMUM_MEMORY: 2G
    volumes:
      - geoserver_data:/opt/geoserver_data
    ports:
      - "${GEOSERVER_PORT:-8086}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Tarea única: crea workspace, datastore y publica las tablas
  geoserver-init:
    image: alpine:3.20
    container_name: observatorio-geoserver-init
    entrypoint: ["sh", "/init.sh"]
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-Hidalgo}
      POSTGRES_DB: ${POSTGRES_DB:-hidalgo}
      POSTGRES_USER: ${POSTGRES_USER:-hidalgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hidalgo}
    volumes:
      - ./docker/geoserver/init.sh:/init.sh:ro
      - ./docker/geoserver/layers.txt:/layers.txt:ro
    depends_on:
      geoserver:
        condition: service_started
    restart: "no"

  # ---------------------------------------------------------------
  # Frontend (React + nginx). /geoserver/ -> contenedor geoserver
  # ---------------------------------------------------------------
  geovisor:
    build:
      context: .
      args:
        VITE_GEOSERVER_URL: ""
        VITE_GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-Hidalgo}
    image: observatorio-hidalgo:latest
    container_name: observatorio-hidalgo
    environment:
      GEOSERVER_UPSTREAM: ${GEOSERVER_UPSTREAM:-http://geoserver:8080}
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - geoserver
    restart: unless-stopped

volumes:
  pgdata:
  geoserver_data:
